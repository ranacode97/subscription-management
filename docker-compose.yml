services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16
    container_name: odoo_db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_secret
      POSTGRES_DB: postgres
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Odoo Server ──
  odoo:
    image: odoo:17.0
    container_name: odoo_server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"   # live chat / longpolling
    volumes:
      # Mount your custom module
      - .:/mnt/extra-addons/subscription_management
      # Persist Odoo filestore
      - odoo_filestore:/var/lib/odoo
      # Custom config
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo_secret
    restart: unless-stopped

volumes:
  odoo_db_data:
  odoo_filestore:
