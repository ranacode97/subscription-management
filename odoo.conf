[options]
; ── Database ──
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secret
db_name = False

; ── Paths ──
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; ── Server ──
http_port = 8069
admin_passwd = admin_master_pwd
list_db = True

; ── Logging ──
log_level = info

; ── Performance ──
workers = 0
max_cron_threads = 1
